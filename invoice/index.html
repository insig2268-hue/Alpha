  <!-- 로직 스크립트 -->
  <script>
    let items = [
      { name: '신선란 30구 (특란)', spec: '1판', qty: 20, price: 5800, isFree: true },
      { name: '국내산 양파', spec: '15kg/망', qty: 10, price: 18000, isFree: true },
      { name: '식용유 업소용', spec: '18L/캔', qty: 5, price: 42000, isFree: false }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('inDate').value = today;

      // 사업자 정보 불러오기 (간이영수증/발주서 캐시 연동)
      const cached = localStorage.getItem('biz_invoice_info') || localStorage.getItem('biz_order_info') || localStorage.getItem('biz_receipt_info');
      if (cached) {
        try {
          const info = JSON.parse(cached);
          if (info.num) document.getElementById('inBizNum').value = info.num;
          if (info.name) document.getElementById('inBizName').value = info.name;
          if (info.ceo) document.getElementById('inCeoName').value = info.ceo;
          if (info.addr) document.getElementById('inBizAddr').value = info.addr;
          if (info.tel) document.getElementById('inBizTel').value = info.tel;
        } catch(e) {}
      }

      renderItemInputs();
      updateInvoice();
    });

    // 2줄 카드형 품목 입력 (글자 짤림 방지 및 개별 과세/면세 선택)
    function renderItemInputs() {
      const list = document.getElementById('itemList');
      list.innerHTML = '';

      items.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'bg-gray-50 p-2.5 rounded-xl border border-gray-200 text-xs space-y-2';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="text" value="${item.name}" placeholder="품목명" class="flex-1 px-2.5 py-1 border rounded bg-white text-xs font-bold outline-none" oninput="items[${idx}].name = this.value; updateInvoice();">
            <select class="px-2 py-1 border rounded bg-white font-semibold text-[11px] ${item.isFree ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-blue-700 bg-blue-50 border-blue-200'}" onchange="items[${idx}].isFree = (this.value === 'free'); renderItemInputs(); updateInvoice();">
              <option value="tax" ${!item.isFree ? 'selected' : ''}>과세 10%</option>
              <option value="free" ${item.isFree ? 'selected' : ''}>면세 (0%)</option>
            </select>
            <button type="button" onclick="removeItemRow(${idx})" class="text-rose-500 hover:text-rose-700 font-bold px-1 text-sm">×</button>
          </div>
          <div class="grid grid-cols-3 gap-2 text-[11px]">
            <div>
              <span class="text-gray-500 block text-[10px]">규격</span>
              <input type="text" value="${item.spec}" placeholder="규격" class="w-full px-1.5 py-1 border rounded bg-white text-center" oninput="items[${idx}].spec = this.value; updateInvoice();">
            </div>
            <div>
              <span class="text-gray-500 block text-[10px]">수량</span>
              <input type="number" value="${item.qty}" min="1" placeholder="수량" class="w-full px-1.5 py-1 border rounded bg-white text-right font-mono" oninput="items[${idx}].qty = Number(this.value) || 0; updateInvoice();">
            </div>
            <div>
              <span class="text-gray-500 block text-[10px]">단가(원)</span>
              <input type="number" value="${item.price}" min="0" step="100" placeholder="단가" class="w-full px-1.5 py-1 border rounded bg-white text-right font-mono" oninput="items[${idx}].price = Number(this.value) || 0; updateInvoice();">
            </div>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function addItemRow() {
      if (items.length >= 5) {
        alert('A4 2단 규격상 1장에 상/하단 동시 출력을 위해 최대 5개 품목까지 권장됩니다.');
        return;
      }
      items.push({ name: '', spec: '', qty: 1, price: 0, isFree: false });
      renderItemInputs();
      updateInvoice();
    }

    function removeItemRow(idx) {
      if (items.length <= 1) {
        alert('최소 1개 품목은 있어야 합니다.');
        return;
      }
      items.splice(idx, 1);
      renderItemInputs();
      updateInvoice();
    }

    function buildStatementHTML(roleText, subColor) {
      const bizNum = document.getElementById('inBizNum').value.trim() || '123-45-67890';
      const bizName = document.getElementById('inBizName').value.trim() || '공급자 상호';
      const ceoName = document.getElementById('inCeoName').value.trim() || '대표자';
      const bizAddr = document.getElementById('inBizAddr').value.trim() || '사업장 주소';
      const bizTel = document.getElementById('inBizTel').value.trim() || '-';
      const clientName = document.getElementById('inClientName').value.trim() || '귀하';
      const receiverName = document.getElementById('inReceiverName').value.trim() || '';
      const dateVal = document.getElementById('inDate').value;

      let totalSupply = 0;
      let totalVat = 0;

      let rowsHTML = '';
      for (let i = 0; i < 5; i++) {
        if (i < items.length) {
          const it = items[i];
          const supply = it.qty * it.price;
          const vat = it.isFree ? 0 : Math.round(supply * 0.1);

          totalSupply += supply;
          totalVat += vat;

          rowsHTML += `
            <tr class="h-6">
              <td>${i + 1}</td>
              <td class="text-left pl-1.5 font-semibold">${it.name || ''}</td>
              <td>${it.spec || ''}</td>
              <td class="font-mono">${it.qty ? it.qty.toLocaleString() : ''}</td>
              <td class="text-right pr-1 font-mono">${it.price ? it.price.toLocaleString() : ''}</td>
              <td class="text-right pr-1 font-mono font-bold">${supply ? supply.toLocaleString() : ''}</td>
              <td class="text-right pr-1 font-mono ${it.isFree ? 'text-emerald-700 font-bold' : ''}">${it.isFree ? '면세' : (vat ? vat.toLocaleString() : '0')}</td>
            </tr>
          `;
        } else {
          rowsHTML += `
            <tr class="h-6">
              <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
          `;
        }
      }

      const grandTotal = totalSupply + totalVat;

      return `
        <div class="border border-gray-800 p-2.5 rounded">
          <div class="flex items-center justify-between border-b-2 border-gray-800 pb-1.5 mb-2">
            <div class="flex items-center gap-2">
              <span class="text-base font-black tracking-wider text-gray-900">거 래 명 세 서</span>
              <span class="text-[10px] font-bold px-1.5 py-0.2 rounded border ${subColor}">${roleText}</span>
            </div>
            <div class="text-[10px] text-right">
              <div>일자: <span class="font-bold">${dateVal}</span></div>
            </div>
          </div>

          <div class="grid grid-cols-12 gap-1.5 text-[10px] mb-2">
            <div class="col-span-5 border border-gray-800 p-1.5 flex flex-col justify-between">
              <div>
                <span class="text-gray-500">공급받는 자:</span>
                <div class="text-xs font-black mt-1 text-gray-900">${clientName} 귀하</div>
              </div>
              <div class="pt-1 border-t border-gray-200 mt-1 flex justify-between items-center text-[10px]">
                <span>인수자: <strong>${receiverName || '______'}</strong></span>
                <span class="text-gray-400">(서명 또는 날인)</span>
              </div>
            </div>

            <div class="col-span-7">
              <table class="inv-table w-full text-left border-collapse text-[10px]">
                <tr>
                  <th rowspan="3" class="w-4 text-center bg-gray-100 p-0.5">공<br>급<br>자</th>
                  <th class="w-12 bg-gray-50 p-0.5 text-gray-600">등록번호</th>
                  <td colspan="3" class="p-0.5 font-bold font-mono">${bizNum}</td>
                </tr>
                <tr>
                  <th class="bg-gray-50 p-0.5 text-gray-600">상호(명)</th>
                  <td class="p-0.5 font-bold">${bizName}</td>
                  <th class="w-8 bg-gray-50 p-0.5 text-gray-600">성명</th>
                  <td class="p-0.5">${ceoName} (인)</td>
                </tr>
                <tr>
                  <th class="bg-gray-50 p-0.5 text-gray-600">사업장</th>
                  <td class="p-0.5 text-[9px] truncate max-w-[120px]">${bizAddr}</td>
                  <th class="bg-gray-50 p-0.5 text-gray-600">연락처</th>
                  <td class="p-0.5 font-mono text-[9px]">${bizTel}</td>
                </tr>
              </table>
            </div>
          </div>

          <table class="inv-table w-full text-center border-collapse text-[10px]">
            <thead>
              <tr class="bg-gray-100 text-[10px]">
                <th class="w-6 py-0.5">No</th>
                <th class="py-0.5">품목명</th>
                <th class="w-12 py-0.5">규격</th>
                <th class="w-10 py-0.5">수량</th>
                <th class="w-14 py-0.5">단가</th>
                <th class="w-16 py-0.5">공급가액</th>
                <th class="w-12 py-0.5">세액</th>
              </tr>
            </thead>
            <tbody class="font-sans">
              ${rowsHTML}
            </tbody>
            <tfoot>
              <tr class="bg-gray-50 font-bold">
                <td colspan="3" class="py-1">합 계</td>
                <td colspan="2" class="text-right pr-1 font-mono text-gray-700">공급: ${totalSupply.toLocaleString()}</td>
                <td class="text-right pr-1 font-mono text-gray-700">세액: ${totalVat.toLocaleString()}</td>
                <td class="text-right pr-1 font-mono text-xs font-black text-gray-900">${grandTotal.toLocaleString()}원</td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;
    }

    function updateInvoice() {
      // 캐시 저장
      localStorage.setItem('biz_invoice_info', JSON.stringify({
        num: document.getElementById('inBizNum').value.trim(),
        name: document.getElementById('inBizName').value.trim(),
        ceo: document.getElementById('inCeoName').value.trim(),
        addr: document.getElementById('inBizAddr').value.trim(),
        tel: document.getElementById('inBizTel').value.trim()
      }));

      document.getElementById('sectionSupplier').innerHTML = buildStatementHTML('공급자 보관용 (적색)', 'border-rose-300 text-rose-700 bg-rose-50');
      document.getElementById('sectionCustomer').innerHTML = buildStatementHTML('공급받는자 보관용 (청색)', 'border-blue-300 text-blue-700 bg-blue-50');
    }

    // 웹 서식과 1:1 완벽 일치하는 거래명세서 ExcelJS 엑셀 변환 함수
    async function exportToExcel() {
      const bizNum = document.getElementById('inBizNum').value.trim() || '123-45-67890';
      const bizName = document.getElementById('inBizName').value.trim() || '공급자 상호';
      const ceoName = document.getElementById('inCeoName').value.trim() || '대표자';
      const bizAddr = document.getElementById('inBizAddr').value.trim() || '사업장 주소';
      const bizTel = document.getElementById('inBizTel').value.trim() || '-';
      const clientName = document.getElementById('inClientName').value.trim() || '귀하';
      const receiverName = document.getElementById('inReceiverName').value.trim() || '';
      const dateVal = document.getElementById('inDate').value || new Date().toISOString().split('T')[0];

      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('거래명세서', {
        views: [{ showGridLines: true }]
      });

      // 열 너비 설정 (A ~ G열)
      ws.columns = [
        { width: 7 },   // A: No
        { width: 26 },  // B: 품목명
        { width: 12 },  // C: 규격
        { width: 10 },  // D: 수량
        { width: 14 },  // E: 단가
        { width: 16 },  // F: 공급가액
        { width: 14 }   // G: 세액
      ];

      const fontDefault = { name: '맑은 고딕', size: 9 };
      const fontBold = { name: '맑은 고딕', size: 9, bold: true };
      const fillGray = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3F4F6' } };
      const borderThin = {
        top: { style: 'thin', color: { argb: 'FF9CA3AF' } },
        left: { style: 'thin', color: { argb: 'FF9CA3AF' } },
        bottom: { style: 'thin', color: { argb: 'FF9CA3AF' } },
        right: { style: 'thin', color: { argb: 'FF9CA3AF' } }
      };

      // 1. 타이틀 & 발행일자 (1~2행)
      ws.mergeCells('A1:E2');
      const titleCell = ws.getCell('A1');
      titleCell.value = '거  래  명  세  서';
      titleCell.font = { name: '맑은 고딕', size: 16, bold: true, color: { argb: 'FF111827' } };
      titleCell.alignment = { vertical: 'middle', horizontal: 'left' };

      ws.getCell('F1').value = '발행구분:';
      ws.getCell('F1').font = fontDefault;
      ws.getCell('G1').value = '공급자/받는자용';
      ws.getCell('G1').font = fontBold;

      ws.getCell('F2').value = '거래일자:';
      ws.getCell('F2').font = fontDefault;
      ws.getCell('G2').value = dateVal;
      ws.getCell('G2').font = fontBold;

      // 2. 공급받는 자 (A4:C7)
      ws.mergeCells('A4:C4');
      ws.getCell('A4').value = '공급받는 자 (납품처)';
      ws.getCell('A4').font = { name: '맑은 고딕', size: 8, color: { argb: 'FF6B7280' } };
      ws.getCell('A4').fill = fillGray;

      ws.mergeCells('A5:C5');
      ws.getCell('A5').value = `${clientName} 귀하`;
      ws.getCell('A5').font = { name: '맑은 고딕', size: 11, bold: true };

      ws.mergeCells('A6:C7');
      ws.getCell('A6').value = `물품 인수자: ${receiverName || '______'} (서명 또는 날인)\n위와 같이 정히 영수(인수)함.`;
      ws.getCell('A6').font = { name: '맑은 고딕', size: 8, color: { argb: 'FF4B5563' } };
      ws.getCell('A6').alignment = { wrapText: true, vertical: 'middle' };

      // 3. 공급자 정보 (D4:G7)
      ws.getCell('D4').value = '등록번호';
      ws.getCell('D4').fill = fillGray;
      ws.getCell('D4').font = fontBold;
      ws.mergeCells('E4:G4');
      ws.getCell('E4').value = bizNum;
      ws.getCell('E4').font = fontBold;

      ws.getCell('D5').value = '상호(명)';
      ws.getCell('D5').fill = fillGray;
      ws.getCell('D5').font = fontBold;
      ws.getCell('E5').value = bizName;
      ws.getCell('E5').font = fontBold;
      ws.getCell('F5').value = '성명';
      ws.getCell('F5').fill = fillGray;
      ws.getCell('F5').font = fontBold;
      ws.getCell('G5').value = `${ceoName} (인)`;
      ws.getCell('G5').font = fontBold;

      ws.getCell('D6').value = '사업장';
      ws.getCell('D6').fill = fillGray;
      ws.getCell('D6').font = fontBold;
      ws.mergeCells('E6:G6');
      ws.getCell('E6').value = bizAddr;
      ws.getCell('E6').font = fontDefault;

      ws.getCell('D7').value = '연락처';
      ws.getCell('D7').fill = fillGray;
      ws.getCell('D7').font = fontBold;
      ws.mergeCells('E7:G7');
      ws.getCell('E7').value = bizTel;
      ws.getCell('E7').font = fontDefault;

      for (let r = 4; r <= 7; r++) {
        for (let c = 1; c <= 7; c++) {
          ws.getRow(r).getCell(c).border = borderThin;
        }
      }

      // 4. 품목 헤더 (9행)
      const headers = ['No', '품 목 명', '규격', '수량', '단가', '공급가액', '세액'];
      const hRow = ws.getRow(9);
      headers.forEach((h, idx) => {
        const cell = hRow.getCell(idx + 1);
        cell.value = h;
        cell.font = fontBold;
        cell.fill = fillGray;
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = borderThin;
      });

      // 5. 품목 데이터 행 (최소 5행)
      let startRow = 10;
      const maxRows = Math.max(items.length, 5);
      let totQty = 0, totSupply = 0, totVat = 0;

      for (let i = 0; i < maxRows; i++) {
        const rowNum = startRow + i;
        const row = ws.getRow(rowNum);

        if (i < items.length) {
          const it = items[i];
          const supply = it.qty * it.price;
          const vat = it.isFree ? 0 : Math.round(supply * 0.1);

          totQty += it.qty;
          totSupply += supply;
          totVat += vat;

          row.getCell(1).value = i + 1;
          row.getCell(1).alignment = { horizontal: 'center' };

          row.getCell(2).value = it.name;
          row.getCell(2).alignment = { horizontal: 'left', indent: 1 };

          row.getCell(3).value = it.spec || '-';
          row.getCell(3).alignment = { horizontal: 'center' };

          row.getCell(4).value = it.qty;
          row.getCell(4).numFmt = '#,##0';
          row.getCell(4).alignment = { horizontal: 'right' };

          row.getCell(5).value = it.price;
          row.getCell(5).numFmt = '#,##0';
          row.getCell(5).alignment = { horizontal: 'right' };

          row.getCell(6).value = supply;
          row.getCell(6).numFmt = '#,##0';
          row.getCell(6).alignment = { horizontal: 'right' };

          if (it.isFree) {
            row.getCell(7).value = '면세';
            row.getCell(7).alignment = { horizontal: 'center' };
          } else {
            row.getCell(7).value = vat;
            row.getCell(7).numFmt = '#,##0';
            row.getCell(7).alignment = { horizontal: 'right' };
          }
        } else {
          row.getCell(1).value = '';
        }

        for (let c = 1; c <= 7; c++) {
          row.getCell(c).font = fontDefault;
          row.getCell(c).border = borderThin;
        }
      }

      // 6. 합계 행
      const totRowNum = startRow + maxRows;
      ws.mergeCells(`A${totRowNum}:C${totRowNum}`);
      const totLabel = ws.getCell(`A${totRowNum}`);
      totLabel.value = '합  계';
      totLabel.font = fontBold;
      totLabel.fill = fillGray;
      totLabel.alignment = { horizontal: 'center' };

      const cellTotQty = ws.getCell(`D${totRowNum}`);
      cellTotQty.value = totQty;
      cellTotQty.numFmt = '#,##0';
      cellTotQty.font = fontBold;
      cellTotQty.alignment = { horizontal: 'right' };

      const cellBlank = ws.getCell(`E${totRowNum}`);
      cellBlank.value = '-';
      cellBlank.alignment = { horizontal: 'center' };

      const cellTotSupply = ws.getCell(`F${totRowNum}`);
      cellTotSupply.value = totSupply;
      cellTotSupply.numFmt = '#,##0';
      cellTotSupply.font = fontBold;
      cellTotSupply.alignment = { horizontal: 'right' };

      const cellTotVat = ws.getCell(`G${totRowNum}`);
      cellTotVat.value = totVat;
      cellTotVat.numFmt = '#,##0';
      cellTotVat.font = fontBold;
      cellTotVat.alignment = { horizontal: 'right' };

      for (let c = 1; c <= 7; c++) {
        const cell = ws.getRow(totRowNum).getCell(c);
        cell.border = borderThin;
        cell.fill = fillGray;
      }

      // 7. 총 청구/인수 합계금액 바
      const grandTotal = totSupply + totVat;
      const bottomRow = totRowNum + 2;
      ws.mergeCells(`A${bottomRow}:D${bottomRow}`);
      ws.getCell(`A${bottomRow}`).value = '총 합계금액 (공급가액 + 부가세)';
      ws.getCell(`A${bottomRow}`).font = fontBold;
      ws.getCell(`A${bottomRow}`).fill = fillGray;

      ws.mergeCells(`E${bottomRow}:G${bottomRow}`);
      ws.getCell(`E${bottomRow}`).value = `₩ ${grandTotal.toLocaleString()}원`;
      ws.getCell(`E${bottomRow}`).font = { name: '맑은 고딕', size: 11, bold: true, color: { argb: 'FF111827' } };
      ws.getCell(`E${bottomRow}`).alignment = { horizontal: 'right' };
      ws.getCell(`E${bottomRow}`).fill = fillGray;

      for (let c = 1; c <= 7; c++) {
        ws.getRow(bottomRow).getCell(c).border = borderThin;
      }

      // 8. 브라우저 즉시 다운로드 실행
      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `거래명세서_${clientName}_${dateVal}.xlsx`;
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
