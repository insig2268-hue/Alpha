<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파워마트 70x30mm 명찰 인쇄 시스템</title>
<!-- Google Fonts: Pretendard / Montserrat -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --badge-width: 70mm;
    --badge-height: 30mm;
    --primary-color: #d82b1e;
    --font-hangul: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    --font-en: "Montserrat", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  body {
    background-color: #1e2430;
    font-family: var(--font-hangul);
    color: #222;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 툴바 UI */
  .app-header {
    width: 100%;
    background: #0f141c;
    border-bottom: 1px solid #2d3748;
    padding: 12px 24px;
    position: sticky;
    top: 0;
    z-index: 999;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-title {
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge-spec-pill {
    background: #e53e3e;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
  }

  .toolbar-controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ctrl-btn {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .btn-print {
    background: #e53e3e;
    color: #fff;
    box-shadow: 0 2px 8px rgba(229, 62, 62, 0.4);
  }
  .btn-print:hover { background: #c53030; }

  .btn-secondary {
    background: #2d3748;
    color: #edf2f7;
  }
  .btn-secondary:hover { background: #4a5568; }

  .btn-outline {
    background: transparent;
    color: #cbd5e0;
    border: 1px solid #4a5568;
  }
  .btn-outline:hover { background: #2d3748; color: #fff; }

  .select-dept {
    background: #1a202c;
    color: #fff;
    border: 1px solid #4a5568;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  /* 안내 바 및 토스트 알림창 */
  .notice-bar {
    width: 100%;
    background: #242c3d;
    color: #cbd5e0;
    font-size: 12px;
    padding: 7px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #323d52;
  }
  .notice-bar span b { color: #fed7d7; }

  .toast-banner {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a202c;
    color: #e2e8f0;
    border: 1px solid #e53e3e;
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast-banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(4px);
    pointer-events: auto;
  }

  /* A4 용지 캔버스 (297mm x 210mm) */
  .page-viewport {
    padding: 24px 0 60px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .a4-sheet {
    width: 297mm;
    height: 210mm;
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    margin-bottom: 30px;
    position: relative;
    box-sizing: border-box;
    padding: 15mm 8.5mm;
    page-break-after: always;
  }

  /* 4열 x 6행 그리드 */
  .badge-grid {
    display: grid;
    grid-template-columns: repeat(4, 70mm);
    grid-template-rows: repeat(6, 30mm);
    width: 280mm;
    height: 180mm;
    margin: 0 auto;
  }

  /* 개별 명찰 슬롯 */
  .badge-slot {
    width: 70mm;
    height: 30mm;
    position: relative;
    box-sizing: border-box;
    background: #ffffff;
    border: 0.5px dashed #cbd5e0;
    display: flex;
    align-items: center;
    padding: 3.5mm 4.5mm 3.5mm 3.5mm;
    overflow: hidden;
  }

  /* 비활성화(X) 슬롯 */
  .badge-slot.is-disabled {
    background: #fafafa;
    cursor: pointer;
  }

  .badge-slot.is-disabled::after {
    content: "✕";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 26px;
    font-weight: 300;
    color: #cbd5e0;
    pointer-events: none;
    transition: all 0.2s;
  }

  .badge-slot.is-disabled:hover {
    background: #edf2f7;
    border-color: #a0aec0;
  }
  .badge-slot.is-disabled:hover::after {
    color: #718096;
    transform: translate(-50%, -50%) scale(1.15);
  }

  .badge-slot.is-disabled .badge-content,
  .badge-slot.is-disabled .slot-actions {
    display: none !important;
  }

  /* 슬롯 제어 액션 (화면 전용) */
  .slot-actions {
    position: absolute;
    top: 2px;
    right: 2px;
    display: none;
    gap: 2px;
    z-index: 10;
  }

  .badge-slot:hover .slot-actions {
    display: flex;
  }

  .btn-slot-del {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: rgba(229, 62, 62, 0.85);
    color: #fff;
    border: none;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .btn-slot-del:hover { background: #c53030; }

  /* 명찰 내부 레이아웃 */
  .badge-content {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    position: relative;
  }

  /* 좌측: 첨부 로고 영역 */
  .badge-logo-box {
    width: 25.5mm;
    height: 22mm;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 2.5mm;
  }

  .badge-logo-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  /* 우측: 텍스트 정보 (세로 중앙 집약 정렬) */
  .badge-text-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    overflow: hidden;
  }

  /* 직책 그룹 */
  .title-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 0.8mm;
  }

  .title-ko {
    font-size: 8.2pt;
    font-weight: 800;
    color: #111827;
    letter-spacing: -0.2px;
    line-height: 1.15;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .title-en {
    font-family: var(--font-en);
    font-size: 5.2pt;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.1px;
    line-height: 1.15;
    margin-top: 0.2mm;
    outline: none;
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  /* 성명 그룹 */
  .name-group {
    display: flex;
    flex-direction: column;
  }

  .name-ko {
    font-size: 16pt;
    font-weight: 900;
    color: #000000;
    letter-spacing: 1.8px;
    line-height: 1.1;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
  }

  .name-en {
    font-family: var(--font-en);
    font-size: 6.2pt;
    font-weight: 700;
    color: #8b99a8;
    letter-spacing: 0.5px;
    line-height: 1.1;
    margin-top: 0.5mm;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
    text-transform: uppercase;
  }

  /* 편집 가능 상태 시각 효과 */
  [contenteditable="true"]:hover {
    background-color: rgba(237, 242, 247, 0.6);
    border-radius: 2px;
  }
  [contenteditable="true"]:focus {
    background-color: #fff;
    outline: 1.5px solid #3182ce;
    border-radius: 2px;
  }

  /* 인쇄 시 스타일 (@media print) */
  @page {
    size: A4 landscape;
    margin: 0;
  }

  @media print {
    body {
      background: none !important;
      color: #000 !important;
      min-height: auto;
      margin: 0;
      padding: 0;
    }

    .app-header,
    .notice-bar,
    .toast-banner,
    .slot-actions {
      display: none !important;
    }

    .page-viewport {
      padding: 0 !important;
    }

    .a4-sheet {
      box-shadow: none !important;
      margin: 0 !important;
      page-break-after: avoid !important;
      width: 297mm !important;
      height: 210mm !important;
    }

    /* 비활성 칸은 인쇄 시 완전히 숨김 (잉크 및 종이 절약) */
    .badge-slot.is-disabled {
      visibility: hidden !important;
      border: none !important;
      background: none !important;
    }
    .badge-slot.is-disabled::after {
      display: none !important;
    }

    /* 활성 명찰 외곽선은 연한 회색 가이드선으로 인쇄 */
    .badge-slot {
      border: 0.5px dotted #cccccc !important;
    }
  }
</style>
</head>
<body>

  <!-- 토스트 알림 배너 -->
  <div id="toastBanner" class="toast-banner">
    <span id="toastBannerMsg">알림 메시지</span>
  </div>

  <!-- 상단 컨트롤 툴바 -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-title">
        <span>⚡ 파워마트 명찰 시스템</span>
        <span class="badge-spec-pill">70 × 30 mm</span>
      </div>
      <button class="ctrl-btn btn-print" onclick="window.print()">
        🖨 바로 인쇄하기 (Ctrl+P)
      </button>
      <button class="ctrl-btn btn-secondary" onclick="resetToSingleBadge()">
        ↺ 1번(윤인식)만 남기고 초기화
      </button>
      <button class="ctrl-btn btn-outline" onclick="activateAllBadges()">
        ▦ 24칸 전체 활성화
      </button>
    </div>

    <div class="toolbar-controls">
      <select id="deptPresetSelect" class="select-dept">
        <optgroup label="경영지원팀">
          <option value="STORE MANAGER|점장">점장 (STORE MANAGER)</option>
          <option value="MANAGEMENT SUPPORT TEAM LEADER|경영지원팀 팀장">경영지원팀 팀장</option>
          <option value="MANAGEMENT SUPPORT MANAGER|경영지원팀 과장">경영지원팀 과장</option>
          <option value="MANAGEMENT SUPPORT ASST. MANAGER|경영지원팀 대리">경영지원팀 대리</option>
          <option value="MANAGEMENT SUPPORT SUPERVISOR|경영지원팀 주임">경영지원팀 주임</option>
          <option value="MANAGEMENT SUPPORT STAFF|경영지원팀 사원">경영지원팀 사원</option>
        </optgroup>
        <optgroup label="농산 부서">
          <option value="PRODUCE TEAM LEADER|농산 팀장">농산 팀장</option>
          <option value="PRODUCE MANAGER|농산 과장">농산 과장</option>
          <option value="PRODUCE ASST. MANAGER|농산 대리">농산 대리</option>
          <option value="PRODUCE SUPERVISOR|농산 주임">농산 주임</option>
          <option value="PRODUCE STAFF|농산 사원">농산 사원</option>
        </optgroup>
        <optgroup label="공산 부서">
          <option value="GROCERY TEAM LEADER|공산 팀장">공산 팀장</option>
          <option value="GROCERY MANAGER|공산 과장">공산 과장</option>
          <option value="GROCERY ASST. MANAGER|공산 대리">공산 대리</option>
          <option value="GROCERY SUPERVISOR|공산 주임">공산 주임</option>
          <option value="GROCERY STAFF|공산 사원">공산 사원</option>
        </optgroup>
        <optgroup label="축산 부서">
          <option value="MEAT TEAM LEADER|축산 팀장">축산 팀장</option>
          <option value="MEAT MANAGER|축산 과장">축산 과장</option>
          <option value="MEAT ASST. MANAGER|축산 대리">축산 대리</option>
          <option value="MEAT SUPERVISOR|축산 주임">축산 주임</option>
          <option value="MEAT STAFF|축산 사원">축산 사원</option>
        </optgroup>
        <optgroup label="수산 부서">
          <option value="SEAFOOD TEAM LEADER|수산 팀장">수산 팀장</option>
          <option value="SEAFOOD MANAGER|수산 과장">수산 과장</option>
          <option value="SEAFOOD ASST. MANAGER|수산 대리">수산 대리</option>
          <option value="SEAFOOD SUPERVISOR|수산 주임">수산 주임</option>
          <option value="SEAFOOD STAFF|수산 사원">수산 사원</option>
        </optgroup>
        <optgroup label="배송 부서">
          <option value="DELIVERY TEAM LEADER|배송 팀장">배송 팀장</option>
          <option value="DELIVERY MANAGER|배송 과장">배송 과장</option>
          <option value="DELIVERY ASST. MANAGER|배송 대리">배송 대리</option>
          <option value="DELIVERY SUPERVISOR|배송 주임">배송 주임</option>
          <option value="DELIVERY STAFF|배송 사원">배송 사원</option>
        </optgroup>
        <optgroup label="고객서비스팀">
          <option value="CS SUPERVISOR|고객서비스팀 주임">고객서비스팀 주임</option>
          <option value="CS STAFF|고객서비스팀 사원">고객서비스팀 사원</option>
        </optgroup>
      </select>
      <button class="ctrl-btn btn-secondary" onclick="addSelectedPreset()">
        + 빈 칸에 직책 추가
      </button>
      <label class="ctrl-btn btn-outline" style="cursor: pointer;">
        🖼 다른 로고 교체
        <input type="file" id="logoUploadInput" accept="image/*" style="display: none;" onchange="handleLogoUpload(event)">
      </label>
    </div>
  </header>

  <!-- 가이드 안내 바 -->
  <div class="notice-bar">
    <span>💡 <b>기본 설정:</b> 1번 칸(윤인식 점장)만 활성화되어 있으며, <b>X 표시된 빈 칸은 인쇄되지 않습니다.</b> X 칸을 클릭하면 새 명찰이 활성화됩니다.</span>
    <span>⚡ 한글 이름을 입력하면 하단 영문 이름이 자동 완성됩니다 (직접 수정도 가능).</span>
  </div>

  <!-- A4 페이지 뷰포트 -->
  <main class="page-viewport">
    <div class="a4-sheet">
      <div class="badge-grid" id="badgeContainer">
        <!-- 자바스크립트로 24개 슬롯이 생성됩니다 -->
      </div>
    </div>
  </main>

    };

    // 국어 초성/중성/종성 로마자 변환 테이블
    const CHOSUNG = ['G', 'KK', 'N', 'D', 'TT', 'R', 'M', 'B', 'PP', 'S', 'SS', '', 'J', 'JJ', 'CH', 'K', 'T', 'P', 'H'];
    const JUNGSUNG = ['A', 'AE', 'YA', 'YAE', 'EO', 'E', 'YEO', 'YE', 'O', 'WA', 'WAE', 'OE', 'YO', 'U', 'WO', 'WE', 'WI', 'YU', 'EU', 'UI', 'I'];
    const JONGSUNG = ['', 'K', 'K', 'KS', 'N', 'NJ', 'NH', 'D', 'L', 'LG', 'LM', 'LB', 'LS', 'LT', 'LP', 'LH', 'M', 'P', 'BS', 'S', 'SS', 'NG', 'J', 'CH', 'K', 'T', 'P', 'H'];

    function romanizeHangulSyllable(char) {
      const code = char.charCodeAt(0) - 0xAC00;
      if (code < 0 || code > 11171) return char;
      const cho = Math.floor(code / 588);
      const jung = Math.floor((code % 588) / 28);
      const jong = code % 28;
      return (CHOSUNG[cho] || '') + (JUNGSUNG[jung] || '') + (JONGSUNG[jong] || '');
    }

    function koreanToEnglishName(koreanName) {
      const clean = koreanName.replace(/\s+/g, '');
      if (!clean) return '';
      const surname = clean[0];
      const given = clean.slice(1);

      let engSurname = SURNAME_MAP[surname] || romanizeHangulSyllable(surname);
      let engGiven = [];
      for (let i = 0; i < given.length; i++) {
        engGiven.push(romanizeHangulSyllable(given[i]));
      }
      return engGiven.length > 0 ? `${engSurname} ${engGiven.join('-')}` : engSurname;
    }

    // 24개 슬롯 데이터 초기화 (1번만 윤인식 활성, 2~24는 비활성)
    const totalSlots = 24;
    const badgeData = Array.from({ length: totalSlots }, (_, i) => {
      if (i === 0) {
        return {
          active: true,
          titleKo: '점장',
          titleEn: 'STORE MANAGER',
          nameKo: '윤 인 식',
          nameEn: 'YOON IN-SIK'
        };
      }
      return {
        active: false,
        titleKo: '직책',
        titleEn: 'POSITION',
        nameKo: '성명',
        nameEn: 'NAME'
      };
    });

    // 토스트 알림창 출력
    let toastTimeout;
    function showNotification(message) {
      const banner = document.getElementById('toastBanner');
      const msgElem = document.getElementById('toastBannerMsg');
      msgElem.textContent = message;
      banner.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.remove('show');
      }, 2500);
    }

    // 화면 렌더링
    function renderBadges() {
      const container = document.getElementById('badgeContainer');
      container.innerHTML = '';

      badgeData.forEach((item, index) => {
        const slot = document.createElement('div');
        slot.className = `badge-slot ${item.active ? '' : 'is-disabled'}`;
        slot.dataset.index = index;

        if (!item.active) {
          slot.onclick = () => activateSlot(index);
          container.appendChild(slot);
          return;
        }

        slot.innerHTML = `
          <div class="slot-actions">
            <button class="btn-slot-del" title="이 칸 비활성화" onclick="deactivateSlot(event, ${index})">✕</button>
          </div>
          <div class="badge-content">
            <div class="badge-logo-box">
              <img src="${currentLogoSrc}" alt="파워마트 로고" class="badge-logo-img">
            </div>
            <div class="badge-text-box">
              <div class="title-group">
                <span class="title-ko" contenteditable="true" spellcheck="false" onblur="updateField(${index}, 'titleKo', this.innerText)">${item.titleKo}</span>
                <span class="title-en" contenteditable="true" spellcheck="false" onblur="updateField(${index}, 'titleEn', this.innerText)">${item.titleEn}</span>
              </div>
              <div class="name-group">
                <span class="name-ko" contenteditable="true" spellcheck="false" oninput="handleNameInput(event, ${index})" onblur="updateField(${index}, 'nameKo', this.innerText)">${item.nameKo}</span>
                <span class="name-en" contenteditable="true" spellcheck="false" onblur="updateField(${index}, 'nameEn', this.innerText)">${item.nameEn}</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(slot);
      });
    }

    function activateSlot(index) {
      const presetVal = document.getElementById('deptPresetSelect').value;
      const [titleEn, titleKo] = presetVal.split('|');

      badgeData[index] = {
        active: true,
        titleKo: titleKo,
        titleEn: titleEn,
        nameKo: '성명',
        nameEn: 'NAME'
      };
      renderBadges();
      showNotification(`${index + 1}번 칸이 [${titleKo}] 명찰로 활성화되었습니다.`);
    }

    function deactivateSlot(event, index) {
      event.stopPropagation();
      badgeData[index].active = false;
      renderBadges();
    }

    function updateField(index, field, value) {
      if (badgeData[index]) {
        badgeData[index][field] = value.trim();
      }
    }

    // 한글 이름 입력 시 영문명 자동 생성
    function handleNameInput(event, index) {
      const rawText = event.target.innerText;
      const engName = koreanToEnglishName(rawText);
      const slot = document.querySelector(`.badge-slot[data-index="${index}"]`);
      if (slot && engName) {
        const engElem = slot.querySelector('.name-en');
        if (engElem) {
          engElem.innerText = engName;
          badgeData[index].nameEn = engName;
        }
      }
      badgeData[index].nameKo = rawText;
    }

    // 1번 칸만 남기고 모두 비활성화
    function resetToSingleBadge() {
      badgeData.forEach((item, idx) => {
        if (idx === 0) {
          badgeData[0] = {
            active: true,
            titleKo: '점장',
            titleEn: 'STORE MANAGER',
            nameKo: '윤 인 식',
            nameEn: 'YOON IN-SIK'
          };
        } else {
          item.active = false;
        }
      });
      renderBadges();
      showNotification('1번 칸(윤인식 점장)만 남기고 초기화되었습니다.');
    }

    // 24칸 전체 활성화
    function activateAllBadges() {
      const presetVal = document.getElementById('deptPresetSelect').value;
      const [titleEn, titleKo] = presetVal.split('|');

      badgeData.forEach((item, idx) => {
        if (!item.active) {
          item.active = true;
          item.titleKo = titleKo;
          item.titleEn = titleEn;
          item.nameKo = '성명';
          item.nameEn = 'NAME';
        }
      });
      renderBadges();
      showNotification('24칸 전체가 활성화되었습니다.');
    }

    // 선택한 프리셋 직책을 비어있는 첫 칸에 추가
    function addSelectedPreset() {
      const presetVal = document.getElementById('deptPresetSelect').value;
      const [titleEn, titleKo] = presetVal.split('|');

      const emptyIndex = badgeData.findIndex(item => !item.active);
      if (emptyIndex === -1) {
        showNotification('모든 24칸이 이미 활성화되어 있습니다.');
        return;
      }

      badgeData[emptyIndex] = {
        active: true,
        titleKo: titleKo,
        titleEn: titleEn,
        nameKo: '성명',
        nameEn: 'NAME'
      };
      renderBadges();
      showNotification(`${emptyIndex + 1}번 칸에 [${titleKo}] 직책이 추가되었습니다.`);
    }

    // 로고 직접 교체 업로드 핸들러
    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        currentLogoSrc = event.target.result;
        renderBadges();
        showNotification('새로운 로고 이미지가 반영되었습니다.');
      };
      reader.readAsDataURL(file);
    }

    // 초기 렌더링
    window.addEventListener('DOMContentLoaded', () => {
      renderBadges();
    });
  </script>
</body>
</html>
