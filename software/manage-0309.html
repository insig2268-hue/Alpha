<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소프트웨어 자료실 관리자 | BizTools</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- 관리자 헤더 -->
  <header class="bg-gray-900 text-white border-b border-gray-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-rose-600 text-white">
          ADMIN
        </span>
        <h1 class="text-base font-bold tracking-tight">자료실 백오피스 관리자</h1>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="openFileStorageModal()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-purple-300 text-xs font-bold rounded-xl transition border border-gray-700 flex items-center gap-1">
          📁 서버 보관함 관리
        </button>
        <button type="button" onclick="openNewModal()" class="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-xl transition flex items-center gap-1.5 shadow active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          <span>신규 소프트웨어 등록</span>
        </button>
        <a href="./index.html" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold rounded-xl transition border border-gray-700">
          실제 사이트 보기 ↗
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-6">

    <!-- 상태 요약 및 안내 바 -->
    <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-sm font-bold text-gray-900">소프트웨어 데이터 현황 관리</h2>
        <p class="text-xs text-gray-500 mt-0.5">
          서버 FTP (<code class="bg-gray-100 px-1 py-0.5 rounded text-purple-700 font-mono">/software/files/</code>)에 미리 올려둔 파일 목록을 드롭다운에서 선택하여 바로 연결할 수 있습니다.
        </p>
      </div>
      <button type="button" onclick="resetToDefault()" class="px-3 py-1.5 text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg font-semibold transition border border-rose-200">
        기본 12종 목록 복원
      </button>
    </div>

    <!-- 카드 목록 그리드 -->
    <div id="adminGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- 자바스크립트로 렌더링 -->
    </div>

  </main>

  <!-- 1. 등록 및 수정 모달 -->
  <div id="modalBox" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-gray-200 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 id="modalTitle" class="text-sm font-bold text-gray-900">신규 소프트웨어 등록</h3>
        <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">×</button>
      </div>

      <form id="swForm" onsubmit="saveSoftware(event)" class="space-y-3">
        <input type="hidden" id="editIndex" value="-1">

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">소프트웨어 명칭</label>
          <input type="text" id="swTitle" required class="w-full px-2.5 py-1.5 text-xs border rounded-lg outline-none focus:ring-1 focus:ring-purple-500 font-bold">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">카테고리</label>
            <select id="swCategory" class="w-full px-2.5 py-1.5 text-xs border rounded-lg outline-none bg-white font-semibold">
              <option value="압축/뷰어">압축 / 뷰어</option>
              <option value="화면캡처">화면 캡처 / 그래픽</option>
              <option value="그래픽/편집">그래픽 / 편집</option>
              <option value="미디어/인코딩">미디어 / 인코딩</option>
              <option value="업무유틸">업무 유틸리티</option>
              <option value="문서오피스">문서 / 오피스</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">버전 또는 용량</label>
            <input type="text" id="swVersion" required class="w-full px-2.5 py-1.5 text-xs border rounded-lg outline-none focus:ring-1 focus:ring-purple-500">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">간단 설명</label>
          <input type="text" id="swDesc" required class="w-full px-2.5 py-1.5 text-xs border rounded-lg outline-none focus:ring-1 focus:ring-purple-500">
        </div>

        <!-- 다운로드 파일 지정 (서버 보관함 선택 / 직접 입력) -->
        <div class="p-3 bg-purple-50/60 rounded-xl border border-purple-100 space-y-2.5">
          <label class="block text-[11px] font-bold text-purple-900">
            다운로드 파일 연결 방식
          </label>

          <!-- ① 서버 보관 파일에서 고르기 -->
          <div>
            <span class="text-[10px] text-gray-500 block mb-1">1. 서버 보관 파일 목록에서 선택:</span>
            <select id="serverFileDropdown" onchange="applyServerFile(this.value)" class="w-full px-2.5 py-1.5 text-xs border rounded-lg bg-white outline-none font-mono text-gray-700">
              <option value="">-- 서버에 업로드된 파일 고르기 --</option>
            </select>
          </div>

          <!-- ② 실제 적용되는 URL 및 파일명 -->
          <div>
            <span class="text-[10px] text-gray-500 block mb-1">2. 최종 다운로드 경로 (URL):</span>
            <input type="text" id="swUrl" placeholder="/software/files/파일명.exe 또는 https://..." required class="w-full px-2.5 py-1.5 text-xs border rounded-lg bg-white outline-none font-mono focus:ring-1 focus:ring-purple-500">
          </div>

          <div>
            <span class="text-[10px] text-gray-500 block mb-1">3. 다운로드 시 저장될 파일명 (.exe / .zip):</span>
            <input type="text" id="swFilename" placeholder="Bandizip_setup.exe" class="w-full px-2.5 py-1.5 text-xs border rounded-lg bg-white outline-none font-mono focus:ring-1 focus:ring-purple-500">
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="submit" id="btnSubmit" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl transition shadow">
            저장하기
          </button>
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold rounded-xl transition">
            취소
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. 서버 파일 보관함 관리 모달 -->
  <div id="fileStorageModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-gray-200 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <div>
          <h3 class="text-sm font-bold text-gray-900">서버 파일 보관함 관리</h3>
          <p class="text-[11px] text-gray-500 mt-0.5">FTP로 <code class="font-mono text-purple-600">/software/files/</code>에 올린 파일명을 등록하세요.</p>
        </div>
        <button type="button" onclick="closeFileStorageModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">×</button>
      </div>

      <!-- 새 파일명 추가 폼 -->
      <div class="flex gap-2">
        <input type="text" id="newServerFileName" placeholder="예: Setup_v1.0.exe 또는 Data.zip" class="flex-1 px-3 py-1.5 text-xs border rounded-xl outline-none focus:ring-1 focus:ring-purple-600 font-mono">
        <button type="button" onclick="addServerFile()" class="px-3.5 py-1.5 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl transition">
          추가
        </button>
      </div>

      <!-- 보관함 파일 목록 -->
      <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1" id="serverFileListContainer">
        <!-- 자바스크립트로 렌더링 -->
      </div>

      <div class="pt-2 border-t text-right">
        <button type="button" onclick="closeFileStorageModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold rounded-xl transition">
          닫기
        </button>
      </div>
    </div>
  </div>

  <script>
    // 기본 12종 데이터
    const defaultSoftwareList = [
      { id: "sw_1", title: "반디집 (Bandizip)", category: "압축/뷰어", version: "v7.32 (Standard 무료)", desc: "상업적 무료 지원, 압축 해제 속도가 가장 빠르고 외산 분할압축까지 완벽 지원하는 필수 압축기.", url: "/software/files/Bandizip_setup.exe", filename: "Bandizip_setup.exe", status: "active" },
      { id: "sw_2", title: "픽픽 (PicPick)", category: "화면캡처", version: "v7.2 (개인/기업 상업용 무료)", desc: "화면 캡처, 이미지 편집, 색상 추출, 눈금자 기능이 통합된 최고 성능의 업무용 캡처 도구.", url: "/software/files/PicPick_setup.exe", filename: "PicPick_setup.exe", status: "active" },
      { id: "sw_3", title: "Everything (초고속 파일검색)", category: "업무유틸", version: "v1.4 (초경량 3MB)", desc: "PC 하드디스크와 외장하드 수십만 개 파일을 0.1초 만에 찾아내는 윈도우 필수 유틸리티.", url: "/software/files/Everything_setup.exe", filename: "Everything_setup.exe", status: "active" },
      { id: "sw_4", title: "PDF24 Creator", category: "문서오피스", version: "v11.15 (100% 무료 무제한)", desc: "PDF 병합, 페이지 분할, 압축, 변환, 서명 기능을 오프라인에서 워터마크 없이 무료 제공.", url: "/software/files/PDF24_setup.exe", filename: "PDF24_setup.exe", status: "active" },
      { id: "sw_5", title: "포토스케이프 X (PhotoScape X)", category: "그래픽/편집", version: "v4.2.8 (Windows 10/11)", desc: "상품 상세페이지 일괄 리사이징, 워터마크 삽입, 누끼 따기 및 사진 보정용 필수 그래픽 도구.", url: "https://apps.microsoft.com/detail/9nblggh4twwg?hl=ko-kr&gl=KR", filename: "PhotoScapeX.zip", status: "active" },
      { id: "sw_6", title: "다뷰 인디 (DaView Indy)", category: "문서오피스", version: "v10.0 (기업/개인 100% 무료)", desc: "한글(HWP), 엑셀, 파워포인트, PDF, 도면(CAD) 등 250여 가지 파일을 프로그램 설치 없이 즉시 여는 통합 뷰어.", url: "/software/files/DaViewIndy_setup.exe", filename: "DaViewIndy_setup.exe", status: "active" },
      { id: "sw_7", title: "꿀뷰 (Honeyview)", category: "압축/뷰어", version: "v5.53 (상업용 무료)", desc: "대용량 고화질 이미지와 압축 파일 내 사진들을 압축 풀지 않고 즉시 초고속 로딩하는 이미지 뷰어.", url: "/software/files/Honeyview_setup.exe", filename: "Honeyview_setup.exe", status: "active" },
      { id: "sw_8", title: "Notepad++ (노트패드++)", category: "업무유틸", version: "v8.6 (오픈소스 무료)", desc: "수십만 행 대용량 CSV/텍스트 데이터 정제, 정규식 일괄 치환, 깨진 문자열 복구용 강력한 에디터.", url: "/software/files/NotepadPP_setup.exe", filename: "NotepadPP_setup.exe", status: "active" },
      { id: "sw_9", title: "ScreenToGif (스크린투지프)", category: "화면캡처", version: "v2.41 (무설치 포터블)", desc: "컴퓨터 화면을 지정해 초고화질 움짤(GIF)로 즉시 녹화·편집. 쇼핑몰 상품 시연 상세페이지 제작 필수 도구.", url: "/software/files/ScreenToGif.zip", filename: "ScreenToGif.zip", status: "active" },
      { id: "sw_10", title: "샤나인코더 (ShanaEncoder)", category: "미디어/인코딩", version: "v6.0.1 (국내 1위 무료)", desc: "쇼핑몰 상세페이지 비디오 용량 압축 및 규격 변환, 자막 합치기 및 무손실 초고속 동영상 변환 인코더.", url: "/software/files/ShanaEncoder_setup.exe", filename: "ShanaEncoder_setup.exe", status: "active" },
      { id: "sw_11", title: "AnyDesk (애니데스크)", category: "업무유틸", version: "v8.0 (초경량 5MB)", desc: "매장 포스기(POS), 재택근무 PC, 창고 관리용 PC에 프로그램 설치 없이 즉시 연결하는 초고속 원격 제어.", url: "/software/files/AnyDesk.exe", filename: "AnyDesk.exe", status: "active" },
      { id: "sw_12", title: "DeepL 번역기 (DeepL for Windows)", category: "업무유틸", version: "v24.x (AI 번역 1위)", desc: "알리바바·1688·타오바오 해외 소싱 및 무역 실무용 AI 번역기. 단축키(Ctrl+C+C)로 화면 텍스트 즉시 번역.", url: "/software/files/DeepL_setup.exe", filename: "DeepL_setup.exe", status: "active" }
    ];

    // 서버(/software/files/) 내 미리 업로드된 파일 풀
    const defaultServerPool = [
      "Bandizip_setup.exe",
      "PicPick_setup.exe",
      "Everything_setup.exe",
      "PDF24_setup.exe",
      "PhotoScapeX.zip",
      "DaViewIndy_setup.exe",
      "Honeyview_setup.exe",
      "NotepadPP_setup.exe",
      "ScreenToGif.zip",
      "ShanaEncoder_setup.exe",
      "AnyDesk.exe",
      "DeepL_setup.exe"
    ];

    let softwareList = [];
    let serverPool = [];

    window.addEventListener("DOMContentLoaded", () => {
      loadData();
      loadServerPool();
    });

    function loadData() {
      const cached = localStorage.getItem("biz_software_list_v4");
      if (cached) {
        softwareList = JSON.parse(cached);
      } else {
        softwareList = [...defaultSoftwareList];
        localStorage.setItem("biz_software_list_v4", JSON.stringify(softwareList));
      }
      renderAdmin();
    }

    function loadServerPool() {
      const cached = localStorage.getItem("biz_server_files_pool");
      if (cached) {
        serverPool = JSON.parse(cached);
      } else {
        serverPool = [...defaultServerPool];
        localStorage.setItem("biz_server_files_pool", JSON.stringify(serverPool));
      }
      populateServerDropdown();
    }

    // 드롭다운에 파일 목록 채우기
    function populateServerDropdown() {
      const select = document.getElementById("serverFileDropdown");
      select.innerHTML = `<option value="">-- 서버에 업로드된 파일 고르기 --</option>`;
      serverPool.forEach(file => {
        const opt = document.createElement("option");
        opt.value = file;
        opt.textContent = `📁 ${file}`;
        select.appendChild(opt);
      });
    }

    // 드롭다운 선택 시 URL과 파일명 자동 입력
    function applyServerFile(fileName) {
      if (!fileName) return;
      document.getElementById("swUrl").value = `/software/files/${fileName}`;
      document.getElementById("swFilename").value = fileName;
    }

    function renderAdmin() {
      const grid = document.getElementById("adminGrid");
      grid.innerHTML = "";

      softwareList.forEach((sw, idx) => {
        const isMaintenance = (sw.status === "maintenance" || !sw.url || sw.url === "#");
        const card = document.createElement("div");
        card.className = "bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-purple-50 text-purple-700 border border-purple-100">
                ${sw.category}
              </span>
              <span class="px-2 py-0.5 text-[10px] font-bold rounded-md ${isMaintenance ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                ${isMaintenance ? '점검중' : '정상 노출'}
              </span>
            </div>
            <h4 class="text-sm font-bold text-gray-900 mb-1">${sw.title}</h4>
            <p class="text-xs text-gray-500 mb-2 leading-relaxed">${sw.desc}</p>
            <div class="text-[11px] font-mono text-purple-700 truncate bg-gray-50 p-1.5 rounded-lg border border-gray-100 mb-4">
              경로: ${sw.url}
            </div>
          </div>
          <div class="pt-3 border-t border-gray-100 flex items-center justify-between">
            <button type="button" onclick="toggleStatus(${idx})" class="px-2.5 py-1 text-xs font-bold rounded-lg ${isMaintenance ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'}">
              ${isMaintenance ? '정상 전환' : '점검 처리'}
            </button>
            <div class="flex items-center gap-2">
              <button type="button" onclick="openEditModal(${idx})" class="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold rounded-lg transition">
                수정
              </button>
              <button type="button" onclick="deleteSW(${idx})" class="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold rounded-lg transition">
                삭제
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleStatus(idx) {
      softwareList[idx].status = (softwareList[idx].status === "maintenance") ? "active" : "maintenance";
      localStorage.setItem("biz_software_list_v4", JSON.stringify(softwareList));
      renderAdmin();
    }

    function openNewModal() {
      document.getElementById("modalBox").classList.remove("hidden");
      document.getElementById("swForm").reset();
      document.getElementById("editIndex").value = "-1";
      document.getElementById("modalTitle").textContent = "신규 소프트웨어 등록";
      document.getElementById("btnSubmit").textContent = "등록하기";
    }

    function openEditModal(idx) {
      const sw = softwareList[idx];
      document.getElementById("modalBox").classList.remove("hidden");
      document.getElementById("editIndex").value = idx;
      document.getElementById("swTitle").value = sw.title;
      document.getElementById("swCategory").value = sw.category;
      document.getElementById("swVersion").value = sw.version;
      document.getElementById("swDesc").value = sw.desc;
      document.getElementById("swUrl").value = sw.url;
      document.getElementById("swFilename").value = sw.filename || "";

      document.getElementById("modalTitle").textContent = `수정: ${sw.title}`;
      document.getElementById("btnSubmit").textContent = "수정 완료";
    }

    function closeModal() {
      document.getElementById("modalBox").classList.add("hidden");
    }

    function saveSoftware(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById("editIndex").value);
      const title = document.getElementById("swTitle").value.trim();
      const category = document.getElementById("swCategory").value;
      const version = document.getElementById("swVersion").value.trim();
      const desc = document.getElementById("swDesc").value.trim();
      const url = document.getElementById("swUrl").value.trim();
      const filename = document.getElementById("swFilename").value.trim() || `${title}.exe`;

      if (!url) {
        alert("다운로드 경로를 입력하거나 서버 보관 파일에서 선택해주세요.");
        return;
      }

      if (editIdx >= 0) {
        softwareList[editIdx].title = title;
        softwareList[editIdx].category = category;
        softwareList[editIdx].version = version;
        softwareList[editIdx].desc = desc;
        softwareList[editIdx].url = url;
        softwareList[editIdx].filename = filename;
        alert("수정되었습니다.");
      } else {
        const newObj = {
          id: "sw_" + Date.now(),
          title,
          category,
          version,
          desc,
          url,
          filename,
          status: "active"
        };
        softwareList.unshift(newObj);
        alert("신규 등록되었습니다.");
      }

      localStorage.setItem("biz_software_list_v4", JSON.stringify(softwareList));
      closeModal();
      renderAdmin();
    }

    function deleteSW(idx) {
      if (!confirm("정말 삭제하시겠습니까?")) return;
      softwareList.splice(idx, 1);
      localStorage.setItem("biz_software_list_v4", JSON.stringify(softwareList));
      renderAdmin();
    }

    function resetToDefault() {
      if (!confirm("정말 기본 12종 목록으로 복원하시겠습니까?")) return;
      softwareList = [...defaultSoftwareList];
      localStorage.setItem("biz_software_list_v4", JSON.stringify(softwareList));
      renderAdmin();
    }

    // --- 서버 파일 보관함 관리 기능 ---
    function openFileStorageModal() {
      document.getElementById("fileStorageModal").classList.remove("hidden");
      renderServerFileList();
    }

    function closeFileStorageModal() {
      document.getElementById("fileStorageModal").classList.add("hidden");
      populateServerDropdown();
    }

    function renderServerFileList() {
      const container = document.getElementById("serverFileListContainer");
      container.innerHTML = "";

      if (serverPool.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 py-3 text-center">등록된 파일명이 없습니다.</p>`;
        return;
      }

      serverPool.forEach((fname, idx) => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between p-2 bg-gray-50 rounded-lg border border-gray-200 text-xs";
        row.innerHTML = `
          <div class="flex items-center gap-2 font-mono text-gray-700 truncate">
            <span>📄</span>
            <span class="truncate">${fname}</span>
          </div>
          <button type="button" onclick="deleteServerFile(${idx})" class="text-rose-500 hover:text-rose-700 text-xs font-bold px-1">
            삭제
          </button>
        `;
        container.appendChild(row);
      });
    }

    function addServerFile() {
      const input = document.getElementById("newServerFileName");
      const name = input.value.trim();
      if (!name) {
        alert("추가할 파일명을 입력해주세요 (예: App_setup.exe)");
        return;
      }

      const ext = name.split('.').pop().toLowerCase();
      if (ext !== 'exe' && ext !== 'zip') {
        alert("확장자는 .exe 또는 .zip 이어야 합니다.");
        return;
      }

      if (serverPool.includes(name)) {
        alert("이미 목록에 존재하는 파일명입니다.");
        return;
      }

      serverPool.push(name);
      localStorage.setItem("biz_server_files_pool", JSON.stringify(serverPool));
      input.value = "";
      renderServerFileList();
    }

    function deleteServerFile(idx) {
      serverPool.splice(idx, 1);
      localStorage.setItem("biz_server_files_pool", JSON.stringify(serverPool));
      renderServerFileList();
    }
  </script>
</body>
</html>
